<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064e3b">
  <title>SLID ETC Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(92vw, 440px);
      border: 1px solid #d1d5db;
      background: #ffffff;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
    }

    img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 22px;
    }

    p {
      margin: 0;
      color: #4b5563;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <img src="/images/slid-logo.png" alt="SLID">
    <h1>You are offline</h1>
    <p>Reconnect to continue the Emergency Travel Certificate application or issuer workflow.</p>
  </main>
</body>
</html>
